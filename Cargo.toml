[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/desktop",
]

[workspace.package]
description = "GUI toolkit to efficiently develop fluid graphical user interfaces for embedded devices and desktop applications"
authors = ["Slint Developers <info@slint.dev>"]
documentation = "https://slint.dev/docs"
edition = "2024"
homepage = "https://slint.dev"
keywords = ["gui", "toolkit", "graphics", "design", "ui"]
license = "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0"
repository = "https://github.com/slint-ui/slint"
rust-version = "1.92"
version = "1.17.0"

[workspace.dependencies]
i-slint-backend-android-activity = { version = "=1.17.0", path = "slint/internal/backends/android-activity", default-features = false }
i-slint-backend-linuxkms = { version = "=1.17.0", path = "slint/internal/backends/linuxkms", default-features = false }
i-slint-backend-qt = { version = "=1.17.0", path = "slint/internal/backends/qt", default-features = false }
i-slint-backend-selector = { version = "=1.17.0", path = "slint/internal/backends/selector", default-features = false }
i-slint-backend-testing = { version = "=1.17.0", path = "slint/internal/backends/testing", default-features = false }
i-slint-backend-winit = { version = "=1.17.0", path = "slint/internal/backends/winit", default-features = false }
i-slint-common = { version = "=1.17.0", path = "slint/internal/common", default-features = false }
i-slint-compiler = { version = "=1.17.0", path = "slint/internal/compiler", default-features = false }
i-slint-core = { version = "=1.17.0", path = "slint/internal/core", default-features = false }
i-slint-core-macros = { version = "=1.17.0", path = "slint/internal/core-macros", default-features = false }
i-slint-live-preview = { version = "=1.17.0", path = "slint/internal/live-preview", default-features = false }
i-slint-renderer-femtovg = { version = "=1.17.0", path = "slint/internal/renderers/femtovg", default-features = false }
i-slint-renderer-skia = { version = "=1.17.0", path = "slint/internal/renderers/skia", default-features = false }
i-slint-renderer-software = { version = "=1.17.0", path = "slint/internal/renderers/software", default-features = false }
slint = { version = "=1.17.0", path = "slint/api/rs/slint", default-features = false }
slint-build = { version = "=1.17.0", path = "slint/api/rs/build", default-features = false }
slint-cpp = { version = "=1.17.0", path = "slint/api/cpp", default-features = false }
slint-interpreter = { version = "=1.17.0", path = "slint/internal/interpreter", default-features = false }
slint-macros = { version = "=1.17.0", path = "slint/api/rs/macros", default-features = false }

vtable = { version = "0.4", path = "slint/helper_crates/vtable" }

by_address = { version = "1.0.4" }
bytemuck = { version = "1.13.1" }
cbindgen = { version = "0.29", default-features = false }
cfg_aliases = { version = "0.2.0" }
clap = { version = "4.0", features = ["derive", "wrap_help"] }
clru = { version = "0.6.0" }
css-color-parser2 = { version = "1.0.1" }
derive_more = { version = "2.0.0", default-features = false, features = ["deref", "deref_mut", "into", "from", "add", "add_assign", "mul", "not", "display"] }
euclid = { version = "0.22.1", default-features = false }
swash = { version = "0.2.7", default-features = false }
glutin = { version = "0.32.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
itertools = { version = "0.14" }
log = { version = "0.4.17" }
notify = { version = "8.0.0", default-features = false, features = ["macos_kqueue"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
resvg = { version = "0.47.0", default-features = false, features = ["text", "raster-images"] }
rowan = { version = "0.16.1" }
rustybuzz = { version = "0.20.0" }
send_wrapper = { version = "0.6.0" }
serde = { version = "1.0.163", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.96" }
softbuffer = { version = "0.4.4", default-features = false }
spin_on = { version = "0.1" }
strum = { version = "0.28", default-features = false, features = ["derive"] }
toml_edit = { version = "0.25.0" }
ttf-parser = { version = "0.25" }
typed-index-collections = "3.2"
web-sys = { version = "0.3.72", default-features = false }
smol_str = { version = "0.3.1" }
rayon = { version = "1.10.0", default-features = false }
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6", features = ["alloc"] }
unicode-segmentation = { version = "1.12.0" }
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
glow = { version = "0.17" }
tikv-jemallocator = { version = "0.6" }
wgpu-28 = { package = "wgpu", version = "28", default-features = false }
wgpu-29 = { package = "wgpu", version = "29", default-features = false }
input = { version = "0.9.0", default-features = false }
tr = { version = "0.1", default-features = false }
fontique = { version = "0.9.0" }
read-fonts = { version = "0.39" }
skrifa = { version = "0.42" }
windows = { version = "0.62" }
windows-core = { version = "0.62.0" }
lyon_path = { version = "1.0", default-features = false }
objc2 = { version = "0.6.3" }
lsp-types = "0.95.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true